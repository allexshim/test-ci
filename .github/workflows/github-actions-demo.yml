name: Node.js CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # ==================== [ 1부: CI 단계 ] ====================
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

      # ==================== [ 2부: CD 단계 ] ====================
      # 1단계: printf를 사용하여 비밀키의 줄바꿈과 포맷을 완벽하게 보존 + known_hosts 등록
      - name: Configure SSH Key and Known Hosts
        env:
          EC2_HOST: ${{ secrets.AWS_PUBLIC_IP }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.AWS_SSH_CREDENTIALS }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

      # 2단계: 타임아웃 설정을 추가하여 무한 대기를 차단하고 소스 코드 전송
      - name: Copy files to EC2 via SCP
        env:
          EC2_HOST: ${{ secrets.AWS_PUBLIC_IP }}
        run: |
          scp -o ConnectTimeout=10 -o BatchMode=yes -r ./* ec2-user@$EC2_HOST:/home/ec2-user/test-ci/

      # 3단계: 원격 접속 후 PM2 실행
      - name: Deploy and Restart PM2 via SSH
        env:
          EC2_HOST: ${{ secrets.AWS_PUBLIC_IP }}
        run: |
          ssh -o ConnectTimeout=10 -o BatchMode=yes ec2-user@$EC2_HOST "
            cd /home/ec2-user/test-ci &&
            npm ci --production &&
            pm2 restart ./dist/main.js --name 'test-ci' || pm2 start ./dist/main.js --name 'test-ci'
          "
