name: Node.js CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # CD 단계에서 이미지 레지스트리 주소를 참조할 수 있도록 전역 아웃풋 설정
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (멀티 플랫폼 빌드 필수 에뮬레이터)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx (최신 캐시 및 빌드 엔진)
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image to ECR
        uses: docker/build-push-action@v6 # 최신 v6 버전 적용
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # 무거운 날짜 계산 대신, 깃 커밋 해시(sha)와 latest를 태그로 깔끔하게 관리
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
          # 💡 최신 공식 빌드 액션은 내부 캐시(cache-from, cache-to)를 지원하므로 buildx 스크립트를 따로 짤 필요가 없습니다.

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code (설계도면 확보용)
        uses: actions/checkout@v4

      - name: Create SSH Setup
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 🌟 [개선 포인트] 컴포즈 설계를 함께 쓰고 싶다면, 여기서 .env와 함께 서류들을 먼저 던집니다.
      - name: Create and Copy Deploy Environment to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          # EC2에 주입할 환경변수 명세서 작성
          cat << ENV_EOF > .deploy.env
          ECR_REGISTRY=${{ needs.build-and-push.outputs.registry }}
          ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG=${{ github.sha }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          ENV_EOF

          # 환경변수 파일 배달
          scp -i ~/.ssh/id_rsa .deploy.env $EC2_USERNAME@$EC2_HOST:/home/$EC2_USERNAME/.deploy.env

          # (만약 docker-compose.yml을 쓰신다면 아래 주석을 해제하여 같이 던지세요)
          # scp -i ~/.ssh/id_rsa docker-compose.yml $EC2_USERNAME@$EC2_HOST:/home/$EC2_USERNAME/docker-compose.yml

      - name: Execute Deployment on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          # 싱글쿼트('EOF')를 사용하여 변수 해석의 권한을 온전히 EC2에게 위임합니다.
          ssh -i ~/.ssh/id_rsa $EC2_USERNAME@$EC2_HOST 'bash -s' << 'EOF'
          set -euo pipefail

          # 배달된 환경변수 로드
          if [ -f ~/.deploy.env ]; then
            export $(cat ~/.deploy.env | xargs)
          fi

          # AWS CLI가 설치되어 있다고 가정하고 ECR 로그인 진행
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

          docker pull "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker stop sample-server 2>/dev/null || true
          docker rm sample-server 2>/dev/null || true
          docker run -d --name sample-server --restart unless-stopped -p 3000:3000 "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          # 안 쓰이는 예전 이미지 및 찌꺼기 청소
          docker image prune -f
          rm -f ~/.deploy.env
          EOF
