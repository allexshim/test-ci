name: Node.js CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_CREDENTIALS }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa

      - name: Copy files to EC2 via SCP
        run: |
          scp -r -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            ./* ec2-user@${{ secrets.AWS_PUBLIC_IP }}:/home/ec2-user/test-ci/

      - name: Deploy and Restart PM2 via SSH
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.AWS_PUBLIC_IP }} "
            cd /home/ec2-user/test-ci &&
            npm ci --production &&
            pm2 restart ./dist/main.js --name 'test-ci' || pm2 start ./dist/main.js --name 'test-ci'
          "
