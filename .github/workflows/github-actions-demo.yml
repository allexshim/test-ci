name: Node.js CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # ==================== [ 1부: CI 단계 ] ====================
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

      # ==================== [ 2부: CD 단계 ] ====================
      - name: Create SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_CREDENTIALS }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.AWS_PUBLIC_IP }} >> ~/.ssh/known_hosts

      - name: Copy files to server
        run: |
          rsync -az --exclude='.git' \
                    --exclude='node_modules' \
                    ./ ec2-user@${{ secrets.AWS_PUBLIC_IP }}:/home/ec2-user/app/

      - name: Install dependencies & restart PM2
        run: |
          ssh ec2-user@${{ secrets.AWS_PUBLIC_IP }} "
            cd /home/ec2-user/app &&
            npm ci --omit=dev &&
            pm2 restart app || pm2 start npm --name app -- start
          "
